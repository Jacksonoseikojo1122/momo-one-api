openapi: 3.1.0
info:
  title: MoMo One-API
  version: 0.1.0
  summary: One API and one webhook format for mobile money collections and payouts across MTN MoMo, Telecel Cash, AirtelTigo Money and M-Pesa.
  description: |
    Routes payments to licensed providers (Paystack, MTN MoMo direct) and never holds funds.
    Money is integer minor units (pesewas, cents). Every create needs an Idempotency-Key.
    Statuses: pending, action_required, succeeded, failed, reversed.
  contact: { name: Jackson Kojo Osei, url: "https://jacksonkojoosei.com/projects/momo-one-api" }
  license: { name: MIT, identifier: MIT }
servers:
  - url: http://localhost:8789
security:
  - bearer: []
paths:
  /v1/collections:
    post:
      summary: Ask a customer to pay (they approve on their phone)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CollectionInput" }
            example: { amount: 2500, currency: GHS, phone: "024 123 4567", network: mtn, customer: { email: ama@example.com }, description: Order 1001, metadata: { order_id: "1001" } }
      responses:
        "201": { description: Created (status is usually pending), content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } } }
        "200": { description: "Replayed: same Idempotency-Key and body", content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Missing or invalid API key }
        "409": { description: Idempotency-Key already used with a different body }
        "422": { description: No provider for that network or currency }
  /v1/payouts:
    post:
      summary: Send money to a customer's mobile money account from your provider balance
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutInput" }
            example: { amount: 10000, currency: GHS, phone: "020 123 4567", network: telecel, customer: { name: Kofi Boateng }, description: Refund 77 }
      responses:
        "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } } }
        "200": { description: Replayed, content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: Idempotency-Key already used with a different body }
        "422": { description: No provider for that network or currency }
  /v1/payments:
    get:
      summary: List your payments, newest first
      parameters:
        - { name: status, in: query, schema: { $ref: "#/components/schemas/Status" } }
        - { name: direction, in: query, schema: { type: string, enum: [collection, payout] } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200, default: 50 } }
      responses:
        "200":
          description: Payments
          content: { application/json: { schema: { type: object, properties: { payments: { type: array, items: { $ref: "#/components/schemas/Payment" } } } } } }
  /v1/payments/{id}:
    get:
      summary: One payment
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Payment, content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } } }
        "404": { description: Not found }
  /v1/payments/{id}/refresh:
    post:
      summary: Ask the provider for the status now
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Payment, content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } } }
  /v1/payments/{id}/otp:
    post:
      summary: Send the OTP for a payment in action_required
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [otp], properties: { otp: { type: string, pattern: "^\\d{4,8}$" } } } } }
      responses:
        "200": { description: Payment, content: { application/json: { schema: { $ref: "#/components/schemas/Payment" } } } }
        "409": { description: The payment isn't waiting for an OTP }
  /v1/payments/{id}/events:
    get:
      summary: Every event for a payment
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Events, content: { application/json: { schema: { type: object, properties: { events: { type: array, items: { $ref: "#/components/schemas/EventView" } } } } } } }
  /v1/events:
    get:
      summary: Your latest 100 events
      responses:
        "200": { description: Events, content: { application/json: { schema: { type: object, properties: { events: { type: array, items: { $ref: "#/components/schemas/EventView" } } } } } } }
  /v1/reconciliation:
    get:
      summary: Counts by status, payments stuck open for over an hour, and mismatches
      responses:
        "200":
          description: Report
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts: { type: object, additionalProperties: { type: integer } }
                  stuck: { type: array, items: { $ref: "#/components/schemas/Payment" } }
                  mismatches: { type: array, items: { $ref: "#/components/schemas/Payment" } }
  /v1/reconciliation/run:
    post:
      summary: Re-check payments completed in the last N hours against the provider
      parameters: [{ name: hours, in: query, schema: { type: integer, default: 24 } }]
      responses:
        "200":
          description: Summary
          content: { application/json: { schema: { type: object, properties: { since: { type: string }, checked: { type: integer }, changed: { type: integer }, mismatched: { type: integer } } } } }
  /v1/routing:
    get:
      summary: Configured providers and which one serves each network
      responses: { "200": { description: Routing } }
  /webhooks/paystack:
    post:
      summary: Paystack events (verified with x-paystack-signature, then re-checked with Paystack)
      security: []
      responses: { "200": { description: Accepted }, "401": { description: Bad signature } }
  /webhooks/mtn:
    post:
      summary: MTN callbacks (need ?token=MTN_CALLBACK_TOKEN; the status is always re-checked with MTN)
      security: []
      parameters: [{ name: token, in: query, required: true, schema: { type: string } }]
      responses: { "200": { description: Accepted }, "403": { description: Wrong token } }
  /health:
    get:
      summary: Liveness, database and routing
      security: []
      responses: { "200": { description: OK } }
webhooks:
  paymentEvent:
    post:
      summary: Sent to WEBHOOK_URL on every status change
      description: |
        Headers: X-Webhook-Id (event id; de-duplicate on it), X-MoMo-One-Event (type),
        X-Signature: sha256=hex(HMAC-SHA256(WEBHOOK_SECRET, raw body)). Same format Webhook Relay's generic source checks.
        Retried after 10s, 30s, 2m, 10m, 30m, then hourly, up to 12 attempts.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                type: { type: string, enum: [payment.pending, payment.action_required, payment.succeeded, payment.failed, payment.reversed, payment.mismatch] }
                created_at: { type: string, format: date-time }
                data: { $ref: "#/components/schemas/Payment" }
      responses: { "200": { description: Any 2xx marks it delivered } }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, description: One of MOMO_API_KEYS }
  parameters:
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 128 } }
    Id: { name: id, in: path, required: true, schema: { type: string } }
  responses:
    BadRequest:
      description: Invalid input
      content: { application/json: { example: { error: Invalid request, issues: [{ path: amount, message: "amount is in minor units (pesewas or cents), e.g. GHS 10.50 is 1050" }] } } }
  schemas:
    Status: { type: string, enum: [pending, action_required, succeeded, failed, reversed] }
    Network: { type: string, enum: [mtn, telecel, airteltigo, mpesa] }
    Base:
      type: object
      required: [amount, currency, phone, network]
      properties:
        amount: { type: integer, minimum: 1, maximum: 100000000, description: "Minor units: 2500 = GHS 25.00" }
        currency: { type: string, enum: [GHS, KES, EUR], description: "EUR is for MTN's sandbox only" }
        phone: { type: string, example: "024 123 4567" }
        network: { $ref: "#/components/schemas/Network" }
        provider: { type: string, description: "Override the route: paystack, mtn_momo or sandbox" }
        description: { type: string, maxLength: 100 }
        metadata: { type: object, additionalProperties: { type: string, maxLength: 500 } }
    CollectionInput:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          properties:
            customer: { type: object, properties: { email: { type: string, format: email, description: Required by Paystack }, name: { type: string } } }
    PayoutInput:
      allOf:
        - $ref: "#/components/schemas/Base"
        - type: object
          required: [customer]
          properties:
            customer: { type: object, required: [name], properties: { name: { type: string }, email: { type: string, format: email } } }
    Payment:
      type: object
      properties:
        id: { type: string, example: pay_073f6528e9649f51d7203c3c }
        direction: { type: string, enum: [collection, payout] }
        status: { $ref: "#/components/schemas/Status" }
        amount: { type: integer }
        currency: { type: string }
        phone: { type: string, example: "233241234567" }
        network: { $ref: "#/components/schemas/Network" }
        provider: { type: string }
        reference: { type: string, format: uuid, description: Given to the provider; how the payment is looked up there }
        provider_reference: { type: [string, "null"], description: "The provider's id, e.g. MTN financialTransactionId or Paystack transfer_code" }
        provider_status: { type: [string, "null"], description: The provider's own status text }
        failure:
          type: [object, "null"]
          properties:
            code: { type: string, enum: [declined, insufficient_funds, expired, account_not_found, limit_reached, not_allowed, provider_error, unknown] }
            message: { type: string }
        action: { type: [object, "null"], properties: { type: { const: otp }, message: { type: string } } }
        customer: { type: object, properties: { name: { type: string }, email: { type: string } } }
        description: { type: [string, "null"] }
        metadata: { type: object, additionalProperties: { type: string } }
        mismatch: { type: object, description: "Present if the provider later reported a different final result", properties: { provider_says: { type: string }, provider_status: { type: string }, seen_at: { type: string } } }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, "null"], format: date-time }
    EventView:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        created_at: { type: string }
        attempts: { type: integer }
        delivered_at: { type: [string, "null"] }
        last_error: { type: [string, "null"] }
        data: { $ref: "#/components/schemas/Payment" }
